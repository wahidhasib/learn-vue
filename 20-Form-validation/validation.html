<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>MovieMenia</title>
</head>

<body>
    <div id="app">

        <div class="container mt-5">
            <div class="row">
                <div class="col-md-6 mx-auto">
                    <div class="card">
                        <div class="card-header">
                            <h4 class="card-title">MovieMenia</h4>
                            <ul class="alert alert-danger" v-if="errors.length != 0">
                                <li v-for="error in errors">{{ error }}</li>
                            </ul>
                        </div>
                        <div class="card-body">
                            <form v-on:submit.prevent="handleSubmit()">
                                <div class="input-group mt-2">
                                    <span class="input-group-text">Title</span>
                                    <input type="text" placeholder="Enter name" v-model.trim="formObj.name" class="form-control">
                                </div>

                                <div class="input-group mt-2">
                                    <span class="input-group-text">Email</span>
                                    <input type="email" placeholder="Enter email..." v-model.trim="formObj.email" class="form-control">
                                </div>

                                <div class="input-group mt-2">
                                    <span class="input-group-text">Number</span>
                                    <input type="number" placeholder="Enter number..." v-model.number="formObj.number" class="form-control">
                                </div>

                                <div class="mt-2">
                                    <label class="form-label d-block">Gender</label>

                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" name="gender" v-model="formObj.gender" id="genderMale" value="male">
                                        <label class="form-check-label" for="genderMale">Male</label>
                                    </div>

                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" name="gender" v-model="formObj.gender" id="genderFemale" value="female">
                                        <label class="form-check-label" for="genderFemale">Female</label>
                                    </div>
                                </div>

                                <div class="mt-2 form-check">
                                    <input type="checkbox" v-model="formObj.subscribe" class="form-check-input" id="subscribe">
                                    <label class="form-check-label" for="subscribe">Subscribe on our youtube</label>
                                </div>

                                <div class="input-group mt-3 d-flex gap-3">
                                    <button type="submit" class="btn btn-success">Add Movie</button>
                                </div>
                            </form>
                        </div>
                        <div class="card-footer">
                            <ul class=" list-group">
                                <li class=" list-group-item d-flex align-items-center justify-content-between">
                                    <span></span>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        const {
            createApp,
            reactive,
        } = Vue;

        createApp({
            setup() {
                const formObj = reactive({
                    name: "",
                    email: "",
                    number: "",
                    gender: "male",
                    subscribe: false,
                });

                const errors = reactive([]);

                function handleSubmit() {
                    errors.length = 0;

                    if (formObj.name.length < 3) {
                        errors.push("Name field should be at least 3char long");
                    }

                    if (formObj.name === '') {
                        errors.push("Name field is required");
                    }

                    if (formObj.email === '') {
                        errors.push("Email field is required");
                    }

                    if (formObj.number === '') {
                        errors.push("Number field is required");
                    }

                    if (formObj.gender === '') {
                        errors.push("Select a gender");
                    }

                    if (formObj.subscribe === false) {
                        errors.push("Please subscribe our newsletter");
                    }

                    console.log(formObj);
                }

                return {
                    formObj,
                    handleSubmit,
                    errors
                }
            }
        }).mount("#app");
    </script>
</body>

</html>
