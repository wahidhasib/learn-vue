<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>

<body>
    <div id="app">
        <h1>{{ counter }}</h1>
        <button @click="counter < 5 && counter++">Increment</button>
        <button @click="counter > 1 && counter--">Decrement</button>
    </div>

    <script>
        const {
            createApp,
            ref,
            computed,
            watch
        } = Vue;

        createApp({
            setup() {
                const counter = ref(0);

                watch(
                    // if I set watcher for an array or object element then we need to use this function
                    () => counter.value,
                    // the other hand when I set it for a immitube varible we don't need so like this ex: counter, then next line...
                    (newValue, oldValue) => {
                        console.log(`Counter changed ${oldValue} to ${newValue}`);

                        if (newValue >= 5) {
                            alert("Max limit reached!");
                        }

                        if (newValue == 0) {
                            alert("Minimum limit reached!");
                        }
                    }
                );

                return {
                    counter,
                }
            }
        }).mount("#app");
    </script>
</body>

</html>
