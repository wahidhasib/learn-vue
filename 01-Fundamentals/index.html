<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <title>Learn Vue with Cdn</title>
</head>

<body>
    <!-- <h1>Hello {{ message }} </h1> -->

    <div id="app">
        <h1>Hi I'm {{ user.name }}. I'm {{ user.age }} years old & I'm from {{ user.city }}. And also my lucky number is : {{ luckyNumber }}</h1>
    </div>

    <script>
        const {
            createApp,
        } = Vue

        createApp({
            setup() {
                const user = {
                    name: "Hasib",
                    age: 26,
                    city: "Rajbari"
                };
                const luckyNumber = Math.ceil(Math.random() * 10);
                return {
                    user,
                    luckyNumber
                }
            }
        }).mount('#app')
    </script>
</body>

</html>
