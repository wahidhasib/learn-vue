<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <title>Reactive</title>
</head>

<body>
    <div id="app">
        <div v-html="message"></div>

        <div v-once="message">This message will render once : {{ message }}</div>
    </div>


    <script>
        const {
            createApp,
            ref,
            onMounted,
        } = Vue;

        createApp({
            setup() {
                const message = ref(`<h1>Hello Vue 3 Test</h1>`);

                function updateFunction() {
                    setTimeout(() => {
                        message.value = `<h1 style="color: red">Hello Vue 3 Test</h1>`;
                    }, 5000);
                }

                onMounted(() => {
                    updateFunction()
                });

                return {
                    message,
                    updateFunction
                }
            }
        }).mount("#app");
    </script>
</body>

</html>
